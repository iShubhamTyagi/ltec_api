# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ltecapi

on:
  push:
    branches:
      - ltec_api_master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "6.0.x"

      - name: Restore NuGet packages
        run: dotnet restore LTEC.csproj

      - name: Build with dotnet
        run: dotnet build LTEC.csproj --configuration Release

      - name: Publish with dotnet
        run: dotnet publish LTEC.csproj --configuration Release --output ./myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: .net-app
          path: ./myapp # Ensure the correct path

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: "Production"

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4 # Updated to v4
        with:
          name: .net-app

      - name: Debug downloaded artifact
        run: ls -R ./myapp # Debugging step to confirm files are downloaded

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: "ltecapi"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FC89A33F5FB6410AB9F789D895637404 }}
          package: ./myapp
